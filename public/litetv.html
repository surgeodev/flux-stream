<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLUX TV — Séries</title>
<link rel="stylesheet" href="lite.css">
<style>
  #panelBack { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.78); z-index: 40; display: none; }
  #panel { position: fixed; left: 5%; right: 5%; top: 16%; max-height: 64vh; overflow-y: auto; z-index: 41; background: #141414; border: 1px solid rgba(255,255,255,0.10); border-radius: 10px; padding: 16px 22px 18px; display: none; -webkit-box-shadow: 0 12px 60px rgba(0,0,0,0.9); box-shadow: 0 12px 60px rgba(0,0,0,0.9); }
  body.tv #panel { top: 14%; }
  .p-title { font-size: 20px; font-weight: 700; color: #fff; letter-spacing: -0.01em; }
  body.tv .p-title { font-size: 30px; }
  .p-sub { margin: 6px 0 2px; font-size: 13px; color: #b5b5b5; line-height: 1.4; }
  body.tv .p-sub { font-size: 19px; }
  .p-row-label { margin: 14px 0 4px; font-size: 12px; font-weight: 700; color: #e5e5e5; text-transform: uppercase; letter-spacing: 1.2px; opacity: 0.7; }
  body.tv .p-row-label { font-size: 17px; }
  .pbtn { display: inline-block; background: #222; color: #fff; border: 1px solid #363636; border-radius: 7px; padding: 9px 16px; margin: 4px 7px 4px 0; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; -webkit-transition: background 0.12s, border-color 0.12s, -webkit-transform 0.1s; transition: background 0.12s, border-color 0.12s, transform 0.1s; }
  body.tv .pbtn { font-size: 24px; padding: 13px 26px; }
  .pbtn:hover, .pbtn:focus, .pbtn.on { background: #C4001A; border-color: #C4001A; outline: none; -webkit-transform: scale(1.05); transform: scale(1.05); }
  .pbtn.on { -webkit-box-shadow: 0 0 18px rgba(196,0,26,0.45); box-shadow: 0 0 18px rgba(196,0,26,0.45); }
  .pback { margin-top: 16px; background: transparent; color: #e5e5e5; border: 1px solid rgba(255,255,255,0.22); border-radius: 7px; padding: 8px 22px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
  body.tv .pback { font-size: 21px; padding: 11px 30px; }
  .pback:hover, .pback:focus { border-color: #C4001A; color: #fff; outline: none; }
</style>
</head>
<body>

<header>
  <h1><img src="logo.png" alt="FLUX"></h1>
  <nav id="topnav">
    <button id="navHome" onclick="location.href='lite.html'">Accueil</button>
    <button id="navMovie" onclick="location.href='litemovie.html'">Films</button>
    <button id="navTv" class="sel">S&eacute;ries</button>
    <button id="navSearch" onclick="location.href='litesearch.html'">Recherche</button>
    <button id="navFs" onclick="toggleFullscreen()" aria-label="Plein écran">
      <svg viewBox="0 0 24 24" fill="#fff"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"></path></svg>
    </button>
  </nav>
</header>

<main>
  <div class="row-section">
    <div class="row-title">S&eacute;ries <em>&middot; choisissez une s&eacute;rie puis la saison et l'&eacute;pisode</em></div>
    <div class="row-scroll" id="grid"></div>
  </div>
  <div id="msg">Chargement...</div>
</main>

<div id="hint">OK / Entr&eacute;e = choisir &middot; fl&egrave;ches = naviguer &middot; Retour = fermer / accueil</div>
<div id="dbg">KC:-</div>

<div id="panelBack"></div>
<div id="panel"></div>

<script>
var LITE_PAGE = 'tv';
</script>
<script src="lrud.js"></script>
<script src="lite-common.js"></script>
<script>
/* ===== Séries : page de choix (série → saison → épisode) ===== */

var seriesSel = null;
var panelOpen = false;
var pPos = { r: 0, c: 0 };
var pS = 0;

function esc(t) {
  return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function openSeries(it) {
  msg('Chargement...');
  var xhr = new XMLHttpRequest();
  xhr.open('GET', '/api/tvdetail?id=' + encodeURIComponent(it.id), true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) return;
    if (xhr.status === 200) {
      try {
        var d = JSON.parse(xhr.responseText);
        if (!d || !d.seasons || !d.seasons.length) { msg('Aucune saison disponible'); return; }
        seriesSel = { it: it, title: d.title || it.title || '', overview: d.overview || '', seasons: d.seasons };
        buildPanel(0, -1);
      } catch (err) { msg('Erreur de donn\u00e9es'); }
    } else { msg('Impossible de charger la s\u00e9rie (' + xhr.status + ')'); }
  };
  xhr.send();
}
openItem = openSeries;

function buildPanel(si, ei) {
  var s = seriesSel.seasons;
  if (!s.length) return;
  if (si < 0) si = 0;
  if (si >= s.length) si = s.length - 1;
  if (ei >= (s[si].eps || 0)) ei = -1;
  var html = '<div class="p-title">' + esc(seriesSel.title) + '</div>';
  if (seriesSel.overview) {
    var ov = seriesSel.overview;
    if (ov.length > 220) ov = ov.substring(0, 220) + '\u2026';
    html += '<div class="p-sub">' + esc(ov) + '</div>';
  }
  html += '<div class="p-row-label">Saison</div><div id="pRowS">';
  for (var i = 0; i < s.length; i++) {
    var lbl = s[i].name || ('Saison ' + s[i].s);
    html += '<button class="pbtn' + (i === si ? ' on' : '') + '" id="pS_' + i + '" onclick="pickSeason(' + i + ')">' + esc(lbl) + '</button>';
  }
  html += '</div>';
  var e = s[si].eps || 0;
  html += '<div class="p-row-label">\u00c9pisode</div><div id="pRowE">';
  if (e) {
    for (var j = 0; j < e; j++) {
      html += '<button class="pbtn' + (j === ei ? ' on' : '') + '" id="pE_' + j + '" onclick="pickEp(' + j + ')">' + (j + 1) + '</button>';
    }
  } else {
    html += '<span class="p-sub">Nombre d\u2019\u00e9pisodes inconnu \u2014 lancez l\u2019\u00e9pisode 1.</span>';
  }
  html += '</div>';
  html += '<div><button class="pback" id="pBack" onclick="closePanel()">&#9664; Retour \u00e0 la liste</button></div>';
  var panel = document.getElementById('panel');
  panel.innerHTML = html;
  document.getElementById('panelBack').style.display = 'block';
  panel.style.display = 'block';
  panelOpen = true;
  pPos = { r: 0, c: 0 };
  focusPanel();
}

function pickSeason(i) { pS = i; buildPanel(i, -1); }

function pickEp(j) {
  var s = seriesSel.seasons[pS] || seriesSel.seasons[0];
  var url = 'litewatch.html?type=tv&id=' + encodeURIComponent(seriesSel.it.id || '') +
            '&title=' + encodeURIComponent(seriesSel.title || '') +
            '&season=' + (s ? s.s : 1) + '&episode=' + (j + 1);
  location.href = url;
}

function closePanel() {
  panelOpen = false;
  document.getElementById('panelBack').style.display = 'none';
  document.getElementById('panel').style.display = 'none';
  document.getElementById('panel').innerHTML = '';
  seriesSel = null;
  msg('');
  try {
    if (navReady && nav) nav.assignFocus('card0');
  } catch (e) {}
  var c0 = document.getElementById('card0');
  if (c0) { try { c0.focus(); } catch (e) {} }
}

/* ===== Nav télécommande du panneau (hameçon posé pour lite-common) ===== */
function panelRows() {
  var out = [];
  var s = document.getElementById('pRowS');
  if (s) { var a = []; var bs = s.getElementsByTagName('button'); for (var i = 0; i < bs.length; i++) a.push(bs[i]); out.push(a); }
  var e = document.getElementById('pRowE');
  if (e) { var b = []; var be = e.getElementsByTagName('button'); for (var j = 0; j < be.length; j++) b.push(be[j]); out.push(b); }
  var bk = document.getElementById('pBack');
  if (bk) out.push([bk]);
  return out;
}

function focusPanel() {
  var rows = panelRows();
  if (!rows.length) return;
  var r = Math.max(0, Math.min(pPos.r, rows.length - 1));
  var c = Math.max(0, Math.min(pPos.c, rows[r].length - 1));
  pPos = { r: r, c: c };
  try { rows[r][c].focus(); } catch (e) {}
}

window.__liteNavHook = function(kc) {
  if (!panelOpen) return false;
  var left = (kc === 37 || kc === 4 || kc === 21);
  var right = (kc === 39 || kc === 5 || kc === 22);
  var up = (kc === 38 || kc === 19 || kc === 203 || kc === 211 || kc === 215 || kc === 29460);
  var down = (kc === 40 || kc === 20 || kc === 204 || kc === 212 || kc === 216 || kc === 29461);
  var enter = (kc === 13 || kc === 32 || kc === 195 || kc === 29443);
  if (!left && !right && !up && !down && !enter) return false;
  var rows = panelRows();
  if (!rows.length) return true;
  var r = Math.max(0, Math.min(pPos.r, rows.length - 1));
  if (left || right) {
    var n = rows[r].length;
    var c = pPos.c;
    if (rows[r].length) c = (right) ? Math.min(n - 1, pPos.c + 1) : Math.max(0, pPos.c - 1);
    pPos = { r: r, c: c };
    focusPanel();
    return true;
  }
  if (up || down) {
    var nr = (down) ? Math.min(rows.length - 1, r + 1) : Math.max(0, r - 1);
    var nc = Math.min(pPos.c, rows[nr] ? Math.max(0, rows[nr].length - 1) : 0);
    pPos = { r: nr, c: nc };
    focusPanel();
    return true;
  }
  if (enter) {
    try { rows[r][pPos.c].click(); } catch (e) {}
    return true;
  }
  return false;
};

window.__liteBack = function() {
  if (!panelOpen) return false;
  closePanel();
  return true;
};

/* La grille ouvre toujours le panneau de choix (série → saison → épisode) */
initLite();
</script>
</body>
</html>
