        <button class="cbtn" id="btnFwd" onclick="skip(10)" aria-label="Avancer 10 s">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="#fff"><path d="M11.99 5V1l7 7-7 7V9c-3.31 0-6 2.69-6 6 0 1.01.25 1.97.7 2.8l-1.46 1.46C4.46 17.03 4 15.57 4 14c0-4.42 3.58-8 8.01-8z"></path></svg>
          <span class="csp">10</span>
        </button>

          <svg viewBox="0 0 24 24" width="24" height="24" fill="#fff"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-8 14H9.5v-2h-2v2H6V9h1.5v2.5h2V9H11v8zm2-6h4.5c.6 0 1.1.5 1.1 1.1v3.9c0 .6-.5 1.1-1.1 1.1H13v-6zm1.5 5.5h2v-4h-2v4z"></path></svg>
        </button>
        <button class="cbtn" id="btnSettings" onclick="toggleSettings()" aria-label="R&eacute;glages">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="#fff"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"></path></svg>

<script src="lrud.js"></script>
<script src="hls.js"></script>
<script>
/* ===== FLUX Lite — Player (Samsung UA32H4500 2014, ES5) ===== */

/* ===== Lecture depuis l'URL ===== */
function _gp(name) {
  var m = location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
  return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
}
var playing = {
  id: _gp('id') || _gp('tmdb'),
  type: _gp('type') || 'movie',
  title: _gp('title'),
  season: parseInt(_gp('season') || _gp('s'), 10) || 1,
  episode: parseInt(_gp('episode') || _gp('e'), 10) || 1
};
var startAt = parseFloat(_gp('t')) || 0;
var startSeeked = false;
if (!playing.id) { location.href = 'lite.html'; }

/* ===== Historique "Continuer à regarder" (lu par l'accueil) ===== */
function saveContinue(pct) {
  try {
    var sec = 0;
    try { var v = document.getElementById('video'); sec = Math.round(v.currentTime || 0); } catch (err) {}
    var list = [];
    try { list = JSON.parse(localStorage.getItem('flux_continue') || '[]'); } catch (e) {}
    if (!(list instanceof Array)) list = [];
    var out = [];
    for (var i = 0; i < list.length; i++) {
      if (list[i] && list[i].id !== playing.id) out.push(list[i]);
    }
    if (pct >= 96) { /* terminé : on retire la rangée */
      localStorage.setItem('flux_continue', JSON.stringify(out));
      return;
    }
    out.unshift({
      id: playing.id,
      type: playing.type,
      title: playing.title || '',
      season: playing.season,
      episode: playing.episode,
      pct: Math.round(pct * 10) / 10,
      sec: sec,
      t: Date.now()
    });
    if (out.length > 20) out.length = 20;
    localStorage.setItem('flux_continue', JSON.stringify(out));
  } catch (e) {}
}

var streams = [];
var streamIdx = 0;
var subsMeta = [];
var subIdx = -1;
var subsOn = false;
var cues = [];
var hlsSubIdx = -1;
var isFullscreen = false;
var ctrlTimer = 0;
var screen = 'player';
/* DVR hls-lite : le player 2014 fige la durée au 1er manifeste (~1 segment),
   il ne peut pas chercher dans les segments suivants. La barre et les skips
   passent par un re-fetch de la playlist tronquée (&start=S) : tvStart est
   la position absolue du segment 0 de la playlist courante, tvTotal la durée
   totale de l'épisode (tmdb-proxy) quand connue. */
var tvStart = 0;
var tvTotal = 0;
var tvWantStart = -1;
var tvSeekRel = -1;

/* ===== Télémétrie ===== */
function tvReport(msg) {
  try {
    var x = new XMLHttpRequest();
    x.open('POST', '/api/error-log', true);
    x.setRequestHeader('Content-Type', 'application/json');
    x.send(JSON.stringify({ src: 'litewatch', ua: (navigator.userAgent || '').slice(0, 160), msg: String(msg).slice(0, 300), t: Date.now() }));
  } catch (e) {}
}
try {
  window.__tvLastMsg = '';
  window.onerror = function(m, s, l, c, e) {
    try { if (window.__tvLastMsg !== m) { window.__tvLastMsg = m; tvReport('JSE: ' + m + ' @' + s + ':' + l); } } catch (err) {}
  };
} catch (e) {}

/* ===== Détection ===== */
var DEV_MSE = false;
var DEV_HLS_NATIVE = false;
var DEV_HEVC = false;
var DEV_MP4 = false;
var DEV_AVC_BASE = false;
var DEV_AVC_MAIN = false;
var DEV_AVC_HIGH = false;
var TV_OLD_2014 = false;

function detectCapabilities() {
  try {
    var v = document.createElement('video');
    if (typeof Hls !== 'undefined' && Hls.isSupported()) DEV_MSE = true;
    if (v.canPlayType('application/vnd.apple.mpegurl') || v.canPlayType('application/x-mpegurl')) DEV_HLS_NATIVE = true;
    try { DEV_HEVC = !!v.canPlayType('video/mp4; codecs="hvc1.1.6.L93.B0"') || !!v.canPlayType('video/mp4; codecs="hev1.1.6.L93.B0"'); } catch (e) {}
    try { DEV_MP4 = !!v.canPlayType('video/mp4'); } catch (e) {}
    try {
      DEV_AVC_BASE = !!v.canPlayType('video/mp4; codecs="avc1.42E01E"') || !!v.canPlayType('video/mp4; codecs="avc1.42001E"');
      DEV_AVC_MAIN = !!v.canPlayType('video/mp4; codecs="avc1.4D401E"') || !!v.canPlayType('video/mp4; codecs="avc1.4D001E"');
      DEV_AVC_HIGH = !!v.canPlayType('video/mp4; codecs="avc1.64001F"') || !!v.canPlayType('video/mp4; codecs="avc1.64001E"');
    } catch (e) {}
    tvReport('PW CAP: mse=' + DEV_MSE + ' hlsN=' + DEV_HLS_NATIVE + ' mp4=' + DEV_MP4 +
             ' avcB=' + DEV_AVC_BASE + ' avcM=' + DEV_AVC_MAIN + ' avcH=' + DEV_AVC_HIGH);
  } catch (e) {}
  var ua = '';
  try { ua = (navigator.userAgent || '').toLowerCase(); } catch (e) {}
  var isSamTV = ua.indexOf('samsung') >= 0 && (ua.indexOf('smart-tv') >= 0 || ua.indexOf('smarttv') >= 0 || ua.indexOf('hinternet') >= 0 || /h\s?\d{4}/.test(ua));
  if (!isSamTV && ua.indexOf('smart-tv') >= 0 && ua.indexOf('linux') >= 0 && ua.indexOf('armv7l') >= 0) isSamTV = true;
  /* LG webOS / autres TV sans MSE : lire severe les mêmes chunks MP4 muxés */
  var isLGTv = ua.indexOf('mobile') < 0 && !/iphone|ipad|ipod/.test(ua)
             && ((ua.indexOf('webos') >= 0 && ua.indexOf('smarttv') >= 0)
                 || (ua.indexOf('lg') >= 0 && (ua.indexOf('smart-tv') >= 0 || ua.indexOf('smarttv') >= 0 || ua.indexOf('netcast') >= 0)));
  /* TV 2014 (plé-Tizen) : qu'UNIQUEMENT si c'est une vraie TV ET pas de
     MSE/HLS.js. Les navigateurs mobiles (Android Chrome/Samsung Internet)
     déclarent aussi le HLS natif → il ne faut PAS les prendre pour des TV ! */
  TV_OLD_2014 = (isSamTV || isLGTv) && !DEV_MSE;
  if (TV_OLD_2014) {
    try { document.body.className += ' tv'; } catch (e) {}
    wireFsAuto();
  }
  tvReport('PW DET: isSamTV=' + isSamTV + ' isLGTv=' + isLGTv + ' TV_OLD_2014=' + TV_OLD_2014 + ' ua=' + ua.slice(0, 120));
}

/* ===== Feedback player ===== */
function showSpinner(on) {
  var s = document.getElementById('spinner');
  if (s) s.className = on ? 'on' : '';
}
function setPstate(t) {
  var p = document.getElementById('pstate');
  if (!p) return;
  if (t) { p.innerHTML = t; p.className = 'on'; if (t.indexOf('Aucune') < 0 && t.indexOf('impossible') < 0) tvReport('PST: ' + t); }
  else { p.innerHTML = ''; p.className = ''; }
}
function setCurNone(on) {
  var c = document.body.className || '';
  var has = c.indexOf('no-cur') >= 0;
  if (on && !has) document.body.className = c + ' no-cur';
  else if (!on && has) document.body.className = c.replace(/ ?no-cur/g, '');
}
function setCtrlsOn(on) {
  var c = document.body.className || '';
  var has = c.indexOf('ctrls-on') >= 0;
  if (on && !has) document.body.className = c + ' ctrls-on';
  else if (!on && has) document.body.className = c.split('ctrls-on').join('').replace(/ {2,}/g, ' ').trim();
}
function showCtrls() {
  var c = document.getElementById('ctrls');
  if (!c) return;
  c.className = '';
  setCtrlsOn(true);
  setCurNone(false);
  if (ctrlTimer) { clearTimeout(ctrlTimer); ctrlTimer = 0; }
  ctrlTimer = setTimeout(function() { autoHideCtrls(); }, 3000);
}
function autoHideCtrls() {
  var v = document.getElementById('video');
  var c = document.getElementById('ctrls');
  if (!c) return;
  ctrlTimer = 0;
  if (menuOpen) { setCurNone(false); return; }
  if (v && !v.paused && !v.ended) {
    c.className = 'hid';
    setCtrlsOn(false);
    setCurNone(true);
  } else {
    c.className = '';
    setCurNone(false);
  }
}
function hideCtrlsNow() {
  var c = document.getElementById('ctrls');
  if (c) c.className = 'hid';
  setCtrlsOn(false);
}

/* ===== Navigation ===== */
var nav = null;
var navReady = false;
var navEls = [];
var navIdx = 0;
var lastSelected = '';

var KEY_RETURN = 10009;
var KEY_BACK = 88;
var KEY_EXIT = 45;
var KEY_PLAY = 415;
var KEY_PAUSE = 19;
var KEY_STOP = 413;
var KEY_FF = 417;
var KEY_RW = 412;
var KEY_RED = 403;
var KEY_GREEN = 404;
var KEY_YELLOW = 405;
var KEY_BLUE = 406;

var lastKc = -1;
var lastEvt = 0;

var NAV_CODES = [37, 38, 39, 40, 4, 5, 19, 20, 21, 22, 203, 204, 205, 206, 211, 212, 213, 214, 215, 216, 217, 218, 29443, 29460, 29461];
var NAV_KEYCODES = {};
for (var _i = 0; _i < NAV_CODES.length; _i++) NAV_KEYCODES[NAV_CODES[_i]] = true;
var ENTER_CODES = { 13: 1, 32: 1, 195: 1, 29443: 1 };

function dbg(kc) {
  var d = document.getElementById('dbg');
  if (!d || d.getAttribute('data-shown') === String(kc)) return;
  d.setAttribute('data-shown', String(kc));
  d.innerHTML = 'KC:' + kc + (navReady ? ' LRUD' : ' -');
}
function buildNav() {
  navReady = false;
  if (!window.LRUD) return;
  try {
    nav = new window.LRUD.Lrud();
    nav.on('move', function(mv) {
      if (mv && mv.enter && mv.enter.id) focusId(mv.enter.id);
    });
    nav.on('select', function(node) {
      lastSelected = node ? node.id : '';
      if (!lastSelected) return;
      var el = document.getElementById(lastSelected);
      if (el && el.click) { try { el.click(); } catch (err) {} }
    });
    navReady = true;
  } catch (err) { navReady = false; }
}
function focusId(id) {
  var el = document.getElementById(id);
  if (el) { try { el.focus(); } catch (err) {} }
}
function currentFocusId() {
  if (navReady && nav && nav.currentFocusNode) return nav.currentFocusNode.id;
  if (navEls[navIdx]) return navEls[navIdx].id;
  return '';
}
function registerPlayerNav() {
  var keep = currentFocusId();
  buildNav();
  if (!navReady) { collectFallback(); return; }
  try {
    nav.registerNode('root', { orientation: 'vertical', isWrapping: true, isIndexAlign: true });
    var groups = [['act', 'tvnav'], ['ctrls', 'ctrlsRow'], ['subs', 'subsPanel'], ['srcs', 'sources']];
    var first = '';
    for (var g = 0; g < groups.length; g++) {
      var box = document.getElementById(groups[g][1]);
      if (!box) continue;
      /* Panneaux popup (sources/sous-titres) : seulement s'ils sont ouverts,
         sinon le focus TV partirait sur des boutons invisibles. */
      if (groups[g][1] === 'subsPanel' || groups[g][1] === 'sources') {
        if (box.className.indexOf('show') < 0) continue;
      }
      var btns = box.getElementsByTagName('button');
      if (!btns.length) continue;
      var gid = 'grp' + g;
      nav.registerNode(gid, { parent: 'root', orientation: 'horizontal', isWrapping: true });
      for (var j = 0; j < btns.length; j++) {
        if (!btns[j].id) continue;
        nav.registerNode(btns[j].id, { parent: gid, isFocusable: true });
        if (!first) first = btns[j].id;
      }
    }
    var target = (keep && nav.getNode(keep)) ? keep : first;
    if (target) { nav.assignFocus(target); focusId(target); }
  } catch (err) { navReady = false; collectFallback(); }
}
function collectFallback() {
  navEls = [];
  var box = document.getElementById('tvnav');
  if (box) {
    var btns = box.getElementsByTagName('button');
    for (var i = 0; i < btns.length; i++) navEls.push(btns[i]);
  }
  for (var k = 0; k < navEls.length; k++) { if (navEls[k].id) {} }
  if (navEls.length) {
    if (navIdx >= navEls.length) navIdx = 0;
    focusId(navEls[navIdx].id);
  }
}
function fallbackMove(dir, vert) {
  var n = navEls.length;
  if (!n) return;
  navIdx = (navIdx + dir + n) % n;
  focusId(navEls[navIdx].id);
}
function handleRemote(e) {
  var kc = e.keyCode || e.which || 0;
  var now = (new Date()).getTime();
  if (kc === lastKc && now - lastEvt < 80) return;
  lastKc = kc;
  lastEvt = now;
  dbg(kc);
  if (menuOpen) {
    if (kc === KEY_RETURN || kc === KEY_BACK || kc === KEY_EXIT || kc === 8 || kc === 27) {
      e.preventDefault ? e.preventDefault() : (e.returnValue = false);
      closeMenu(); return;
    }
    if (ENTER_CODES[kc]) {
      e.preventDefault ? e.preventDefault() : (e.returnValue = false);
      var mit = menuItems[menuIdx];
      var mfn = mit ? mit.onpick : null;
      closeMenu();
      if (mfn) mfn();
      return;
    }
    if (kc === 38 || kc === 19 || kc === 203 || kc === 211 || kc === 215 || kc === 29460 ||
        kc === 40 || kc === 20 || kc === 204 || kc === 212 || kc === 216 || kc === 29461) {
      e.preventDefault ? e.preventDefault() : (e.returnValue = false);
      menuMove((kc === 38 || kc === 19 || kc === 203 || kc === 211 || kc === 215 || kc === 29460) ? -1 : 1);
      return;
    }
  }
  if (kc === KEY_RETURN || kc === KEY_BACK || kc === KEY_EXIT || kc === 8 || kc === 27) {
    e.preventDefault ? e.preventDefault() : (e.returnValue = false);
    goHome(); return;
  }
  if ((kc === KEY_PLAY || kc === KEY_PAUSE) && screen === 'player') {
    e.preventDefault ? e.preventDefault() : (e.returnValue = false);
    togglePlay(); return;
  }
  if (navReady) {
    if (ENTER_CODES[kc]) {
      e.preventDefault ? e.preventDefault() : (e.returnValue = false);
      lastSelected = '';
      nav.handleKeyEvent(e);
      if (screen === 'player' && !lastSelected) togglePlay();
      return;
    }
    if (NAV_KEYCODES[kc]) {
      e.preventDefault ? e.preventDefault() : (e.returnValue = false);
      /* TV : en cours de lecture, les flèches gauche/droite = +10s / -10s
         (le code plus bas est inaccessible : navReady absorbe tout). */
      if (TV_OLD_2014 && screen === 'player') {
        var hz = (kc === 37 || kc === 39 || kc === 4 || kc === 5 || kc === 21 || kc === 22);
        if (hz) {
          var vv = document.getElementById('video');
          if (vv && !vv.paused && !vv.ended) {
            skip((kc === 37 || kc === 4 || kc === 21) ? -10 : 10);
            return;
          }
        }
      }
      nav.handleKeyEvent(e);
      return;
    }
  }
  var dir = 0;
  var vert = false;
  if (kc === 37 || kc === 4 || kc === 21) dir = -1;
  else if (kc === 39 || kc === 5 || kc === 22) dir = 1;
  else if (kc === 38 || kc === 19 || kc === 203 || kc === 211 || kc === 215 || kc === 29460) { dir = -1; vert = true; }
  else if (kc === 40 || kc === 20 || kc === 204 || kc === 212 || kc === 216 || kc === 29461) { dir = 1; vert = true; }
  if (dir) {
    e.preventDefault ? e.preventDefault() : (e.returnValue = false);

function fetchTvTotal() {

      ? 'tv/' + playing.id + '/season/' + playing.season + '/episode/' + playing.episode

function fixTvHlsUrl(u, idx) {

       transcode continu ffmpeg 640p en segments TS 8s, playlist EVENT que la TV

       finir en .m3u8 sinon lavf52 refuse la playlist (commentaire server.py).

    var q = 'tmdb=' + encodeURIComponent(playing.id)

  if (u.indexOf('magnet%3A') >= 0) return false;
  var t = ((s.title || '') + ' ' + (s.provider || '') + ' ' + (s.name || '')).toLowerCase();
  var q = (s.quality || '').toLowerCase();
  var isHls = u.indexOf('m3u8-proxy') >= 0 || u.indexOf('.m3u8') >= 0;
  var isHevc = /hevc|h265|10bit|hdr|dolby/.test(t + ' ' + u + ' ' + q);
  var isMkv = /mkv|webm|avi/.test(t);
  if (isMkv) return false;

function scoreStream(s) {

  var q = s.quality || '';

  if (/notorrent/i.test(s.provider || '')) sc += 300;
  if (/vixsrc/i.test(s.provider || '')) sc += 150;
  if (/file-proxy/.test(u)) sc += 250;
  if (/ts-proxy/.test(u)) sc += 90;
  if (/m3u8-proxy/.test(u) || u.indexOf('.m3u8') >= 0) sc -= (canPlayHls() ? 20 : 300);
  if (/mp4/i.test(t) || /mp4/i.test(u)) sc += 120;
  if (/mkv|webm|avi|hevc|h265|10bit|hdr/i.test(t)) sc -= (DEV_HEVC ? 60 : 400);
  if (/2160|4k/i.test(q)) sc -= 50;
  if (/8k/i.test(q)) sc -= 120;

}
function fixUrl(u) {

  if (m) {
    var decoded = decodeURIComponent(m[1]);
    if (u.indexOf('file-proxy') >= 0 || u.indexOf('ts-proxy') >= 0) {
      if (/^https?:/i.test(decoded)) {
        if (decoded.indexOf('vixsrc.to') >= 0 || decoded.indexOf('vix-content.net') >= 0)
          return '/api/dlproxy/?url=' + encodeURIComponent(decoded);
        return '/api/proxy?url=' + encodeURIComponent(decoded);
      }
      return decoded;
    }
    if (u.indexOf('m3u8-proxy') >= 0) {
      if (/^https?:/i.test(decoded)) {
        if (decoded.indexOf('vixsrc.to') >= 0 || decoded.indexOf('vix-content.net') >= 0)
          return '/api/dlproxy/?url=' + encodeURIComponent(decoded);
        return '/api/proxy?url=' + encodeURIComponent(decoded);

  if (u.indexOf('/api/') === 0) return u;
  u = u.replace(/http:\/\/localhost:8787/g, 'http://' + host + ':8787');
  u = u.replace(/http:\/\/127\.0\.0\.1:8787/g, 'http://' + host + ':8787');
  if (u.indexOf(':8787') >= 0) return u;

/* ===== HLS / lecture directe / chunks TV ===== */
var hlsInstance = null;
var liteAudioOrder = [];
function liteAudioPrio(at) {
  var s = (at.lang || at.name || '').toLowerCase();
  if (/fre|fran|fra/.test(s)) return 0;
  if (/eng|eng|angl/.test(s)) return 1;
  if (/ita|ital/.test(s)) return 3;
  return 2;
}
function sortLiteAudioTracks(tracks) {
  var list = tracks.slice();
  list.sort(function(a, b) { return liteAudioPrio(a) - liteAudioPrio(b); });
  return list;
}
var streamWatchdog = 0;

  if (streamWatchdog) { clearTimeout(streamWatchdog); streamWatchdog = 0; }
}
function armWatchdog(fn, ms) {

}
function destroyHls() {

    if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
  } catch (e) {}
}
function hlsJsAvailable() {
  try {

    return true;
  } catch (e) { return false; }
}
function playHlsUrl(video, url) {
  destroyHls();
  setPstate('Chargement du flux...');
  if (hlsJsAvailable()) {
    try {
      hlsInstance = new Hls({ maxBufferLength: 30, maxMaxBufferLength: 60, startLevel: -1, capLevelToPlayerSize: false });
      hlsInstance.loadSource(url);
      hlsInstance.attachMedia(video);
      hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
        setPstate('');
        showSpinner(false);
        /* Piste audio par défaut : français, sinon anglais, sinon la première */
        try {
          if (hlsInstance && hlsInstance.audioTracks && hlsInstance.audioTracks.length > 1) {
            liteAudioOrder = sortLiteAudioTracks(hlsInstance.audioTracks);
            var defa = -1;
            for (var ai = 0; ai < liteAudioOrder.length; ai++) {
              var atr = (liteAudioOrder[ai].lang || liteAudioOrder[ai].name || '').toLowerCase();
              if (/fre|fran|fra/.test(atr)) { defa = ai; break; }
            }
            if (defa < 0) {
              for (var ei = 0; ei < liteAudioOrder.length; ei++) {
                var etr = (liteAudioOrder[ei].lang || liteAudioOrder[ei].name || '').toLowerCase();
                if (/eng|angl/.test(etr)) { defa = ei; break; }
              }
            }
            if (defa < 0) defa = 0;
            hlsInstance.audioTrack = liteAudioOrder[defa].id;
          }
        } catch (ee) {}
        try { video.play(); } catch (e) {}
      });
      hlsInstance.on(Hls.Events.ERROR, function(_, data) {
        if (data.fatal) {
          if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
            try { hlsInstance.startLoad(); } catch (e) {}
          } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
            try { hlsInstance.recoverMediaError(); } catch (e) {}
          } else { destroyHls(); if (video.onerror) video.onerror(); }
        }

      return true;
    } catch (e) { destroyHls(); }
  }
  try {
    if (TV_OLD_2014 || video.canPlayType('application/vnd.apple.mpegurl') || video.canPlayType('application/x-mpegurl')) {
      video.src = url;
      video.load();
      try { video.play(); } catch (e) {}
      return true;
    }
  } catch (e) {}
  return false;
}
function playDirectUrl(video, url) {

  video.src = url;
  video.load();
  try { video.play(); } catch (e) {}
}

function selectSource(idx) {
  streamIdx = idx;
  markSource();

  var finalUrl = fixUrl(streams[idx].url);
  var isHls = (finalUrl.indexOf('.m3u8') >= 0 || finalUrl.indexOf('m3u8') >= 0);

  setPstate('');

  if (isHls || TV_OLD_2014) {
    if (TV_OLD_2014) {
      if (!playHlsUrl(video, finalUrl)) { pmsg('HLS non supporté — essayez une autre source'); setPstate('HLS non supporté'); showSpinner(false); }
    } else if (!playHlsUrl(video, finalUrl)) { pmsg('HLS non supporté — essayez une autre source'); setPstate('HLS non supporté'); showSpinner(false); }
  } else {

function tryStream(idx) {
  streamIdx = idx;
  markSource();
  var video = document.getElementById('video');
  var finalUrl = fixUrl(streams[idx].url);
  var isHls = (finalUrl.indexOf('.m3u8') >= 0 || finalUrl.indexOf('m3u8') >= 0);
  if (TV_OLD_2014) {

    else { pmsg('Aucune source lisible sur cette t\u00e9l\u00e9vision'); setPstate('Lecture impossible'); }

  armWatchdog(function() {
    if (screen !== 'player') return;

  }, wdMs);
  tvReport('TRY src=' + (idx + 1) + '/' + streams.length + ' url=' + String(finalUrl).slice(0, 140));
  if (TV_OLD_2014) {
    /* Mode TV 2014 : lecture native HLS des segments hls-lite (playlist .m3u8
       + segments /ll/ servis en GET simple). La TV gère le re-poll de la
       playlist ; on surveille uniquement avec le watchdog + onerror. */
    if (!playHlsUrl(video, finalUrl)) { clearWatchdog(); destroyHls(); if (video.onerror) video.onerror(); }
  } else if (isHls) {
    if (!playHlsUrl(video, finalUrl)) { clearWatchdog(); destroyHls(); if (video.onerror) video.onerror(); }
  } else {
    playDirectUrl(video, finalUrl);
  }
}

var tvFsDone = false;

  try {
    if (document.fullscreenElement || document.webkitFullscreenElement || document.webkitIsFullScreen) return true;
  } catch (e) {}

}
function enterFull() {
  /* Entrée seule (jamais de toggle) : utilisée par le plein écran auto TV.
     Un keydown suivi de son keyup ne doit pas rebasculer en arrière. */
  try {
    var wrap = document.getElementById('vwrap');
    var v = document.getElementById('video');
    if (wrap.requestFullscreen) { wrap.requestFullscreen(); return; }
    if (wrap.webkitRequestFullscreen) { wrap.webkitRequestFullscreen(); return; }
    if (wrap.webkitRequestFullScreen) { wrap.webkitRequestFullScreen(); return; }
    if (v.webkitEnterFullscreen) { v.webkitEnterFullscreen(); return; }
  } catch (err) {}

  document.body.style.overflow = 'hidden';
  isFullscreen = true;
}

function bodyHasCl(cl) {
  return (' ' + (document.body.className || '') + ' ').indexOf(' ' + cl + ' ') >= 0;
}
function bodyAddCl(cl) {
  if (!bodyHasCl(cl)) document.body.className = (document.body.className || '') + ' ' + cl;

    .replace(new RegExp(' ' + cl + ' '), ' ').replace(/^\s+|\s+$/g, '');

function siteFull() {
  /* Plein écran du site entier (toute la page, pas seulement #vwrap). */
  var d = document.documentElement;
  var v = document.getElementById('video');

  try {
    active = !!(document.fullscreenElement || document.webkitFullscreenElement || document.webkitIsFullScreen);
  } catch (e) {}
  if (active) { exitSiteFull(); return; }
  var ok = false;
  try {
    if (d.requestFullscreen) { d.requestFullscreen(); ok = true; }
    else if (d.webkitRequestFullscreen) { d.webkitRequestFullscreen(); ok = true; }
    else if (d.webkitRequestFullScreen) { d.webkitRequestFullScreen(); ok = true; }
    else if (v && v.webkitEnterFullscreen) { v.webkitEnterFullscreen(); ok = true; }
  } catch (e) {}

}

    if (document.exitFullscreen) document.exitFullscreen();

    else if (document.webkitCancelFullScreen) document.webkitCancelFullScreen();
  } catch (e) {}

}
function tryFullTv() {
  /* Plein écran auto immédiat, comme les plateformes TV. Ne brûle jamais
     l'état : si le navigateur ignore l'appel sans geste utilisateur, le
     prochain événement (clé, clic, touch, playing) retente. */
  if (tvFsDone || document.body.className.indexOf('tv') < 0) return;
  if (tvFullActive()) { tvFsDone = true; return; }

function fmt(t) {
  if (!t || isNaN(t)) return '0:00';
  var h = Math.floor(t / 3600);
  var m = Math.floor((t % 3600) / 60);
  var s = Math.floor(t % 60);
  if (h > 0) return h + ':' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  return m + ':' + (s < 10 ? '0' : '') + s;
}

function loadSubs() {
  var xhr = new XMLHttpRequest();
  /* Filtre côté serveur par titre → jamais de subs d'un autre film */
  xhr.open('GET', '/api/subtitles/local?q=' + encodeURIComponent(playing.title || ''), true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4 && xhr.status === 200) {
      try {
        var d = JSON.parse(xhr.responseText);
        subsMeta = (d.subtitles || []).slice();
        renderSubsPanel();
      } catch (err) {}
    }
    fetchExternalSubs();
  };
  xhr.send();
}
function fetchExternalSubs() {
  var isTv = playing.type === 'tv';
  var u = '/api/subtitles?type=' + (isTv ? 'tv' : 'movie') + '&tmdb_id=' + playing.id;
  if (isTv) u += '&season=' + playing.season + '&episode=' + playing.episode;
  var xhr = new XMLHttpRequest();
  xhr.open('GET', u, true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4 && xhr.status === 200) {
      try {
        var d = JSON.parse(xhr.responseText);
        subsMeta = subsMeta.concat(d.subtitles || []);
        renderSubsPanel();
      } catch (err) {}
    }
  };
  xhr.send();
}
function fetchSub(meta) {
  var v = document.getElementById('video');
  var u;
  if (meta.file) {
    u = '/api/subtitle-download-local?file=' + encodeURIComponent(meta.file);
  } else {
    u = '/api/subtitle-download?file_id=' + encodeURIComponent(meta.file_id);
    if (v.duration && v.duration > 0) u += '&duration=' + Math.round(v.duration);
  }
  var xhr = new XMLHttpRequest();
  xhr.open('GET', u, true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4 && xhr.status === 200) {
      cues = parseVtt(xhr.responseText);
      subsOn = true;
    }
  };
  xhr.send();
}
function parseVtt(text) {
  var out = [];
  var blocks = (text || '').split(/\r?\n\r?\n/);
  for (var i = 0; i < blocks.length; i++) {
    var lines = blocks[i].split(/\r?\n/);
    var tm = null;
    var tmIdx = -1;
    for (var l = 0; l < lines.length; l++) {
      var m = lines[l].match(/(?:(\d{1,2}):)?(\d{1,2}):(\d{2})(?:[.,](\d{1,3}))?\s*-->\s*(?:(\d{1,2}):)?(\d{1,2}):(\d{2})(?:[.,](\d{1,3}))?/);
      if (m) { tm = m; tmIdx = l; break; }
    }
    if (!tm) continue;
    var t0 = (+tm[1] || 0) * 3600 + (+tm[2]) * 60 + (+tm[3]) + (+tm[4] || 0) / 1000;
    var t1 = (+tm[5] || 0) * 3600 + (+tm[6]) * 60 + (+tm[7]) + (+tm[8] || 0) / 1000;
    var txt = '';
    for (var k = tmIdx + 1; k < lines.length; k++) {
      var tl = lines[k].replace(/^\d+\s*$/, '').replace(/^\s+|\s+$/g, '');
      if (tl) txt += (txt ? ' ' : '') + tl;
    }
    txt = txt.replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').replace(/^\s+|\s+$/g, '');
    if (txt) out.push({ s: t0, e: t1, t: txt });
  }
  return out;
}

/* ===== Reprise à t (param 't') + seek DVR TV =====
   HLS/lecture directe : seek simple une fois la durée connue.
   TV 2014 : l'URL porte &start=S (playlist tronquée) ; on se positionne à
   tvSeekRel dans cette fenêtre au premier loadedmetadata, puis on fige
   tvStart (=S) pour les calculs absolus de la barre/skip. */
function applyStartOffset() {
  var v = document.getElementById('video');
  if (TV_OLD_2014 && tvSeekRel >= 0) {
    if (!v || !v.duration) return;
    try { v.currentTime = tvSeekRel; } catch (e) {}
    tvStart = tvWantStart;
    tvSeekRel = -1;
    startSeeked = true;
    tvReport('SEEK dvr=' + tvStart + '+' + (v.currentTime || 0));
    return;
  }
  if (startSeeked || startAt <= 0) return;
  if (!v || !v.duration) return;
  try { v.currentTime = startAt; } catch (e) {}
  startSeeked = true;
  tvReport('SEEK t=' + startAt);
}
function wireVideo() {
  var v = document.getElementById('video');
  try {
    v.addEventListener('loadstart', function() { if (screen === 'player') tvReport('V:loadstart'); }, false);
    v.addEventListener('loadedmetadata', function() { if (screen === 'player') { tvReport('V:meta dur=' + v.duration); applyStartOffset(); } }, false);
    v.addEventListener('waiting', function() { if (screen === 'player') { tvReport('V:waiting'); pmsg('Chargement...'); showSpinner(true); setPstate(''); } }, false);
    v.addEventListener('canplay', function() { if (screen === 'player') { var el = document.getElementById('pmsg'); if (el) el.innerHTML = ''; showSpinner(false); setPstate(''); } clearWatchdog(); applyStartOffset(); }, false);
    v.addEventListener('playing', function() {
      if (screen === 'player') {
        tvReport('V:playing');
        var el = document.getElementById('pmsg');
        if (el) el.innerHTML = '';
        showSpinner(false);
        setPstate('');
      }
      applyStartOffset();
      setPlayIcon(false);
      showCtrls();
      clearWatchdog();
      tryFullTv();
    }, false);
    v.addEventListener('pause', function() { setPlayIcon(true); tvFlash(true); showCtrls(); }, false);
    v.addEventListener('play', function() { setPlayIcon(false); tvFlash(false); }, false);
    v.addEventListener('ended', function() {
      if (screen === 'player') { setPstate('Fin de la lecture'); showCtrls(); }
    }, false);
    v.addEventListener('error', function() { if (screen === 'player') { tvReport('V:error code=' + (v.error ? v.error.code : '?') + ' src=' + String(v.currentSrc || '').slice(0, 120)); } }, false);
    v.addEventListener('click', function() { if (screen === 'player' && !barDrag) showCtrls(); }, false);
    v.addEventListener('mousemove', function() { if (screen === 'player' && !menuOpen && document.body.className.indexOf('no-cur') >= 0) showCtrls(); }, false);  } catch (e) {}
}

/* ===== Boot ===== */
detectCapabilities();
tvReport('PW OPEN: ' + playing.type + '/' + playing.id + ' S' + playing.season + 'E' + playing.episode + ' ' + (playing.title || '').slice(0, 60));
wireVideo();
rebuildInfo();
registerPlayerNav();
setPlayIcon(true);
pmsg('');
if (TV_OLD_2014 || playing.type === 'movie') {
  /* TV 2014 : lecture directe (la fiche est masquée) ; films : idem */
  fetchTvTotal();
  if (TV_OLD_2014 && startAt > 0) {
    /* Reprise "continuer à regarder" : DVR direct, la playlist est tronquée
       &start=t (les segments existent déjà sur disque). */
    tvWantStart = Math.max(0, Math.floor((startAt - 8) / 8) * 8);
    tvSeekRel = startAt - tvWantStart;
  }
  loadSubs();
  play();
}
</script>
