<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FLUX</title>
  <script>
    (function () {
      var path = window.location.pathname.replace(/\/flux-stream\//, '/').replace(/^\/flux-stream$/, '/')
      var qs = window.location.search
      sessionStorage.setItem('flux-redirect', path + qs)
      window.location.replace('./index.html')
    })()
  </script>
</head>
<body></body>
</html>
